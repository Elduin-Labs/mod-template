# .github/workflows/release.yml
#
# Publishes to Modrinth when a version tag is pushed (e.g. v1.2.3).
#
# MODRINTH_TOKEN comes from the GitHub organization secret, so new repos in the
# org inherit it and there is nothing to configure per mod.
#
# One Modrinth upload per Minecraft version, because a Modrinth version entry is
# tied to the game versions it supports. The `minecraft` matrix below is the
# same list as the Stonecutter versions in settings.gradle.kts — the new-mod
# skill fills both in together, and they must stay in sync.
#
# Stonecutter names its subprojects "<mc-version>-fabric", so the jar for
# 1.21.11 lands in versions/1.21.11-fabric/build/libs/.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build every version
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # KEEP IN SYNC with the Stonecutter version list in settings.gradle.kts.
        # `java` is what that Minecraft version runs on: 21 up to 1.21.x, 25 from 26 on.
        include:
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.2"
            java: "25"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: versions

      - name: Publish ${{ matrix.minecraft }} to Modrinth
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: versions/${{ matrix.minecraft }}-fabric/build/libs/!(*-sources|*-dev|*-shadow|*-javadoc).jar

          name: ${{ github.ref_name }} for ${{ matrix.minecraft }}
          version: ${{ github.ref_name }}+mc${{ matrix.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md

          game-versions: ${{ matrix.minecraft }}
          loaders: fabric
          java: ${{ matrix.java }}
